name: nexo
services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-4173}:8080"
    depends_on:
      auth-api:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  auth-api:
    build:
      context: .
      target: auth-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:4173}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Configura FIREBASE_PROJECT_ID en .env}
      FIRESTORE_DATABASE_ID: ${FIRESTORE_DATABASE_ID:-(default)}
      FIRESTORE_NAMESPACE: ${FIRESTORE_NAMESPACE:-nexo}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
