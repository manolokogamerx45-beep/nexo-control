server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /health/web { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://auth-api:4173;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
    }
    # Never serve the operational bundle without checking the session.
    location = /app.js {
        proxy_pass http://auth-api:4173;
        proxy_set_header Host $host;
    }
    location = / { try_files /index.html =404; }
    location = /aviso-privacidad { try_files /aviso-privacidad.html =404; }
    location ~ ^/(index\.html|aviso-privacidad\.html|offline\.html|styles\.css|auth\.css|auth\.js|sw\.js)$ { try_files $uri =404; }
    # PWA manifest and install icons.
    location = /manifest.webmanifest { types { } default_type application/manifest+json; try_files $uri =404; }
    location ~ ^/icons/(icon-192|icon-512|icon-maskable-512|apple-touch-icon)\.png$ { try_files $uri =404; }
    location / { return 404; }
}
